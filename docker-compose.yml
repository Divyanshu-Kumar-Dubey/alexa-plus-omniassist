version: '3.8'

services:
  mcp-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omniassist-mcp-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - omniassist-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web-simulator:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: omniassist-web-simulator
    ports:
      - "5173:5173"
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - omniassist-net

networks:
  omniassist-net:
    driver: bridge
